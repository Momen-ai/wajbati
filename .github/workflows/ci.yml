name: CI Pipeline

on:
  push:
    branches: [ "main", "fix/*", "feat/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-audit:
    name: Lint & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, fileinfo, curl, zip, gd, bcmath, soap
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install NPM dependencies & build assets
        run: |
          npm ci
          npm run build

      - name: Run Laravel Pint (Code Style)
        run: vendor/bin/pint --test

      - name: Composer Audit
        run: composer audit --abandoned=ignore || true

      - name: NPM Audit
        run: npm audit --audit-level=critical || true

  test-sqlite:
    name: Tests (PHP ${{ matrix.php }} - SQLite)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, fileinfo, curl, zip, gd, bcmath, soap
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Node & build assets
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate

      - name: Run Test Suite
        run: php artisan test --without-tty

  test-mysql:
    name: Tests (PHP 8.3 - MySQL 8.0)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: wajbati_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, pdo_sqlite, sqlite3, fileinfo, curl, zip, gd, bcmath, soap
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Node & build assets
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: |
          npm ci
          npm run build

      - name: Prepare environment for MySQL
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: wajbati_test
          DB_USERNAME: root
          DB_PASSWORD: password

      - name: Run Database Migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: wajbati_test
          DB_USERNAME: root
          DB_PASSWORD: password

      - name: Run Test Suite on MySQL
        run: php artisan test --without-tty
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: wajbati_test
          DB_USERNAME: root
          DB_PASSWORD: password
